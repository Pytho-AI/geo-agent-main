# Internal tile cache for the geo-agent stack.
#
# tileserver-gl has NO persistent tile cache of its own — its docs
# (docs/deployment.rst "Caching") direct you to put a caching reverse
# proxy in front of it. This container is that proxy, INSIDE the
# geo-agent compose stack: geo-agent-backend's /api/v1/tiles/* routes
# proxy here, this caches on disk, and only cache misses hit the
# tileserver render path (or the ESRI upstream for satellite).
#
# Nothing outside the geo-agent stack talks to this container or to the
# tileserver. geo-agent-backend:8000 is the single public surface.

load_module /usr/lib/nginx/modules/ngx_http_js_module.so;

# info level so the resolver's lock / re-lock lines land in docker logs.
error_log /dev/stderr info;

worker_processes 2;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Self-resolving Protomaps planet build (see pmtiles_resolver.js).
    # The tileserver's config points at the STABLE internal URL
    # /planet.pmtiles; the resolver locks onto the newest live dated
    # build and transparently re-locks when the CDN prunes it.
    js_import pmtiles from /etc/nginx/pmtiles_resolver.js;
    js_shared_dict_zone zone=pmtiles:32k;
    js_set $pmtiles_date pmtiles.date;
    js_fetch_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    # The stale-path retry buffers one ranged read via ngx.fetch;
    # pmtiles directory reads can exceed the 1m njs default.
    js_fetch_max_response_buffer_size 32m;

    proxy_cache_path /var/cache/nginx/tiles
                     keys_zone=tiles:50m
                     levels=1:2
                     inactive=365d
                     max_size=10g;

    # Docker embedded DNS — resolve the tileserver service name at
    # request time so a tileserver recreate doesn't freeze a dead IP.
    # ipv6=off — the container has no IPv6 route; without it the dynamic
    # proxy_pass tries build.protomaps.com's AAAA record first and burns
    # a failed connect before falling back to IPv4.
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 8080;

        # ── Protomaps planet archive, self-resolving ─────────────────
        # tileserver-gl range-fetches the planet PMTiles from here
        # (tileserver-config.json: http://tilecache:8080/planet.pmtiles).
        location = /planet.pmtiles {
            js_content pmtiles.route;
        }

        location /_pmtiles/fetch {
            internal;
            proxy_pass https://build.protomaps.com/$pmtiles_date.pmtiles;
            proxy_ssl_server_name on;
            proxy_ssl_name build.protomaps.com;
            proxy_http_version 1.1;
            # Range requests must reach the CDN untouched — the pmtiles
            # driver reads the archive by byte ranges.
            proxy_set_header Host build.protomaps.com;
            proxy_buffering off;
            # Build pruned mid-flight -> re-probe + retry (once; nginx's
            # recursive_error_pages default prevents loops).
            proxy_intercept_errors on;
            error_page 404 = /_pmtiles/stale;
        }

        location /_pmtiles/stale {
            internal;
            js_content pmtiles.stale;
        }

        # Rendered raster basemaps (default + terrain + topo), opaque
        # JPG. proxy_cache_lock collapses MapLibre's ~20-tile pan burst
        # for the same tile into one upstream render.
        #
        # $style_rev rides the cache key so a STYLE EDIT can invalidate
        # 365d-cached tiles without wiping the whole cache volume (which
        # would also evict the planet pmtiles range cache + satellite
        # tiles). Bump the rev in the SAME commit as any change under
        # infra/tileserver/styles/ or sprites/; old entries age out via
        # the cache manager.
        location ~ ^/styles/(default|terrain|topo)/([0-9]+)/([0-9]+)/([0-9]+)\.jpg$ {
            set $style_rev "r1";
            proxy_pass http://tileserver:8080;
            proxy_cache tiles;
            proxy_cache_valid 200 365d;
            proxy_cache_valid 404 1m;
            proxy_cache_key "$uri|$style_rev";
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Mapterhorn Terrarium DEM tiles for the CLIENT-SIDE contour
        # source (frontend utils/contours.js via the backend's
        # /tiles/dem route). Same pattern as the ESRI satellite proxy:
        # upstream TLS + on-disk cache. Elevation data is static —
        # 365d TTL like every other permanent tile shape.
        location ~ ^/dem/([0-9]+)/([0-9]+)/([0-9]+)\.webp$ {
            proxy_pass https://tiles.mapterhorn.com/$1/$2/$3.webp;
            proxy_cache tiles;
            proxy_cache_valid 200 365d;
            proxy_cache_valid 404 1m;
            proxy_cache_key "$uri";
            proxy_cache_lock on;
            proxy_ssl_server_name on;
            proxy_ssl_name tiles.mapterhorn.com;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Raw vector tiles (Protomaps basemap PMTiles) for client-side
        # place labels.
        location ~ ^/data/basemap/([0-9]+)/([0-9]+)/([0-9]+)\.pbf$ {
            proxy_pass http://tileserver:8080;
            proxy_cache tiles;
            proxy_cache_valid 200 365d;
            proxy_cache_valid 404 1m;
            proxy_cache_key "$uri";
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Weather raster tiles (the analyst weather overlay; upstream is
        # OpenWeatherMap Weather Maps 2.0). Same pattern as the ESRI
        # satellite proxy below: upstream TLS + on-disk cache. The
        # backend's /tiles/weather route appends the API key
        # (server-side env) before proxying here, so the key never
        # reaches a browser; it rides the cache key harmlessly
        # (constant per deployment). Weather-aligned caching: the
        # upstream refreshes ~10-minutely, the TTL is 10m, and the
        # backend rounds ?date= down to 600s so the cache key itself
        # rolls forward with the weather.
        location ~ ^/weather/([A-Z0-9]+)/([0-9]+)/([0-9]+)/([0-9]+)$ {
            proxy_pass https://maps.openweathermap.org/maps/2.0/weather/$1/$2/$3/$4$is_args$args;
            proxy_cache tiles;
            proxy_cache_valid 200 10m;
            proxy_cache_valid 404 1m;
            proxy_cache_key "$uri$is_args$args";
            proxy_cache_lock on;
            proxy_ssl_server_name on;
            proxy_ssl_name maps.openweathermap.org;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # ESRI World Imagery satellite. ESRI's path is TMS-flipped
        # ({z}/{y}/{x}) vs MapLibre's {z}/{x}/{y} — flipped here.
        location ~ ^/satellite/([0-9]+)/([0-9]+)/([0-9]+)\.jpg$ {
            proxy_pass https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/$1/$3/$2;
            proxy_cache tiles;
            proxy_cache_valid 200 365d;
            proxy_cache_valid 404 1m;
            proxy_cache_key "$uri";
            proxy_cache_lock on;
            proxy_ssl_server_name on;
            proxy_ssl_name server.arcgisonline.com;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Everything else (glyph fonts, style JSON, labels PNG, health)
        # passes through uncached.
        location / {
            proxy_pass http://tileserver:8080;
        }
    }
}
