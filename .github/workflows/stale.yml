name: Stale Branches

on:
  schedule:
    - cron: '0 6 1 * *'    # 06:00 UTC on the 1st of every month (effectively just after the last day)
  workflow_dispatch:         # allow manual runs

permissions:
  issues: write     # create/update stale-branch issues
  contents: write   # delete stale branches
  pull-requests: read   # REQUIRED by pr-check below. Declaring a permissions block
                        # sets every unlisted scope to `none`, so without this the
                        # PR lookup returns "Resource not accessible by integration"
                        # — and the action logs the error and deletes the branch
                        # anyway. The guard fails OPEN. Do not remove.

jobs:
  stale_branches:
    runs-on: ubuntu-latest
    steps:
      # The stale-branches action fails OPEN: if its pull-request lookup errors it
      # logs the failure and deletes the branch anyway. Prove the token can list
      # PRs before letting the deleter run, so a 403, a rate limit or a transient
      # 5xx aborts the job instead of silently disabling pr-check.
      - name: Verify pull-request read access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pulls?state=open&per_page=1" >/dev/null 2>&1 \
            || { echo "::error::Cannot list pull requests - pr-check would fail open. Aborting before any deletion."; exit 1; }

      - name: Stale Branches
        uses: crs-k/stale-branches@v10.0.0
        with:
          days-before-stale: 120
          days-before-delete: 180
          dry-run: false        # live: deletes branches inactive 180+ days
          pr-check: true         # never touch a branch with an open PR
